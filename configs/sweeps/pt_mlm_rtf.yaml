# lr grid (config lr /3, x1, x3) for mlm rtf pretraining, 5k steps, eval every 500 (val = pretext val loss); GH200 or MIG only
# launch from thesis/lincs: slurm/sweep.sh configs/sweeps/pt_mlm_rtf.yaml 3 gh200
program: scripts/pretrain.jl
project: lincs-sweeps
name: pt_mlm_rtf
method: grid
metric:
  name: val
  goal: minimize
parameters:
  wandb_project:
    value: lincs-sweeps
  max_steps:
    value: 5000
  eval_every:
    value: 500
  lr:
    values: [0.0009, 0.0027, 0.0081]
command:
  - ${env}
  - bash
  - slurm/sweep_run.sh
  - ${program}
  - configs/pretrain/mlm_rtf.toml
  - ${args_no_hyphens}
