# pretrain lr grid (config lr /3, x1, x3); filled in by scripts/sweep.jl
program: scripts/pretrain.jl
project: lincs-sweeps
name: ${NAME}
method: grid
metric:
  name: val
  goal: minimize
parameters:
  wandb_project:
    value: lincs-sweeps
  max_steps:
    value: 5000
  eval_every:
    value: 500
  lr:
    values: ${LR_GRID}
${FIXED}
command:
  - ${env}
  - julia
  - --threads=1,0
  - ${program}
  - ${CONFIG}
  - ${args_no_hyphens}
