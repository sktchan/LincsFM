# mlp baseline random search over lr, dropout, depth and width; filled in by scripts/sweep.jl
program: scripts/baseline.jl
project: lincs-sweeps
name: ${NAME}
method: random
metric:
  name: best_val_acc
  goal: maximize
parameters:
  wandb_project:
    value: lincs-sweeps
  level:
    value: ${LEVEL}
  save_model:
    value: false
  max_steps:
    value: ${MAX_STEPS}
  eval_every:
    value: ${EVAL_EVERY}
  lr:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  drop_prob:
    distribution: uniform
    min: 0.01
    max: 0.3
  n_layers:
    values: [1, 2, 3, 4, 5, 6, 7, 8]
  mlp_hidden_dim:
    values: [256, 512, 1024, 2048, 4096, 8192, 16384]
${FIXED}
run_cap: 20
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
command:
  - ${env}
  - julia
  - --threads=1,0
  - ${program}
  - ${CONFIG}
  - ${args_no_hyphens}
