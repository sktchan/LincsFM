# finetune random search over lr and drop_prob; filled in by scripts/sweep.jl
program: scripts/finetune.jl
project: lincs-sweeps
name: ${NAME}
method: random
metric:
  name: best_val_acc
  goal: maximize
parameters:
  wandb_project:
    value: lincs-sweeps
  level:
    value: ${LEVEL}
  max_steps:
    value: ${MAX_STEPS}
  eval_every:
    value: 1000
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.002
  drop_prob:
    distribution: uniform
    min: 0.0
    max: 0.3
${FIXED}
run_cap: 20
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
command:
  - ${env}
  - julia
  - --threads=1,0
  - ${program}
  - ${CONFIG}
  - ${args_no_hyphens}
